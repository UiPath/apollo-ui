name: Apollo Vertex Auto Merge
on:
    pull_request:
        types:
            - opened
            - reopened
            - ready_for_review
            - synchronize
        branches: [main]
        paths:
            - "apps/apollo-vertex/**"
            - "packages/apollo-vertex/**"

# Deny-all default; the enable-auto-merge job grants only what it needs.
permissions: {}

jobs:
    enable-auto-merge:
        # Never auto-merge a fork PR. Fork PRs require human review regardless of file scope —
        # the path-based check below cannot establish trust in the author's commits.
        if: github.event.pull_request.head.repo.fork == false
        permissions:
            contents: read
            pull-requests: write
        runs-on: uipath-ubuntu-latest

        steps:
            - name: Check for changes outside apollo-vertex
              id: scope
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
                  EXPECTED_FILES: ${{ github.event.pull_request.changed_files }}
              run: |
                  # The pulls/files API paginates past the 300-file cap of `gh pr diff` but stops at 3000
                  # files, so compare against the PR total. Fetch on its own line so an API failure fails
                  # the step. Renames also list their old path, so moving a file out of another directory
                  # counts.
                  FILES_TSV=$(gh api --paginate "repos/${GH_REPO}/pulls/${PR_NUMBER}/files" --jq '.[] | [.filename, (.previous_filename // "")] | @tsv')
                  LISTED=$(printf '%s\n' "$FILES_TSV" | grep -c . || true)
                  CHANGED_FILES=$(printf '%s\n' "$FILES_TSV" | tr '\t' '\n' | grep . || true)
                  FILES_OUTSIDE=$(printf '%s\n' "$CHANGED_FILES" | grep -vE '^(apps|packages)/apollo-vertex/' || true)
                  if [ "$LISTED" -ne "$EXPECTED_FILES" ] || [ -z "$CHANGED_FILES" ]; then
                    echo "vertex_only=false" >> "$GITHUB_OUTPUT"
                    echo "Skipping auto-merge — listed $LISTED of $EXPECTED_FILES changed files"
                  elif [ -n "$FILES_OUTSIDE" ]; then
                    echo "vertex_only=false" >> "$GITHUB_OUTPUT"
                    echo "Skipping auto-merge — PR touches files outside apps/apollo-vertex/ and packages/apollo-vertex/:"
                    echo "$FILES_OUTSIDE"
                  else
                    echo "vertex_only=true" >> "$GITHUB_OUTPUT"
                  fi

            - name: Generate GitHub App token
              if: steps.scope.outputs.vertex_only == 'true'
              uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
              id: app-token
              with:
                  client-id: ${{ vars.RELEASER_APP_CLIENT_ID }}
                  private-key: ${{ secrets.RELEASER_APP_PRIVATE_KEY }}
                  owner: ${{ github.repository_owner }}
                  repositories: ${{ github.event.repository.name }}
                  permission-pull-requests: write

            - name: Enable auto-merge
              if: steps.scope.outputs.vertex_only == 'true'
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
                  PR_URL: ${{ github.event.pull_request.html_url }}
              run: |
                  gh pr merge --auto --rebase "$PR_URL"
