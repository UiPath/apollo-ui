name: Install Node dependencies
description: Sets up pnpm + Node and runs `pnpm install --frozen-lockfile`.

inputs:
  node-version:
    description: Node major version
    required: false
    default: "22"

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm

    - name: Install dependencies
      shell: bash
      env:
        # The runner's Safe-chain shim applies its own minimum package age, on
        # top of pnpm's. Our own scope is exempt in pnpm-workspace.yaml too.
        SAFE_CHAIN_MINIMUM_PACKAGE_AGE_EXCLUSIONS: "@uipath/*"
      run: pnpm install --frozen-lockfile
