  "svgo@>=4.0.0": "^4.1.0"              # same two advisories on the v4 line (no 4.0.x patch) — transitive via cssnano>postcss-svgo (^4.0.0); 4.1.0 also bumps sax 1.6.1 / css-what ^7 / css-select ^6 (all long-aged, maintainers unchanged)
  colord: "2.9.4"                       # GHSA-2wm5-q62r-hmrv (moderate, quadratic backtracking rejecting oversized malformed color strings) — transitive via cssnano>postcss-colormin (^2.9.3) and stylelint (^2.9.3). Pinned exact: ^2.9.4 would reach 2.10.0 (feature release, unvetted). No npm provenance on any colord release (classic token publish); publisher omgovich unchanged since 2021 and fix commit 8701808 "reject malformed color strings in linear time" (#141) matches the advisory
  katex: "0.18.10"                     # GHSA-238p-pmpm-9mq7 / CVE-2026-103923 (low, prototype pollution in settings bypasses `trust`; patched 0.18.2) — mermaid, rehype-katex, micromark-extension-math, nextra all still pin ^0.16, so force the 0.18 line. 0.18.0 prefixes KaTeX's generic CSS classes (accent/sizing/vbox/... -> katex-*); markup and katex.min.css come from the same resolved package so they stay in sync, and Apollo only targets the unchanged root `.katex`. Pinned exact: 0.18.11 is deprecated upstream ("accidentally published with breaking changes", = 0.19.0) (it shipped 0.19.0's breaking `strict` change for missing character metrics); ^0.18.10 would resolve to it. Our renderers use output: 'mathml', which does no metric lookups, so behavior matches 0.16 either way. 0.18.10 vetted 2026-10-16: aged past quarantine (2026-09-30), release notes 0.18.3-0.18.10 fixes/features only ✓, no new deps beyond commander ✓
# Advisories with no installable fix — FIXME: remove each entry once a patched version is reachable
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm   # braces <=3.0.3 (high, deeply nested pattern stack exhaustion) — no patched release exists (3.0.3 is latest, advisory lists no fix) as of 2026-10-09; via micromatch/chokidar
    - GHSA-gcqx-w48m-w2h4   # deepmerge <=4.3.1 (low) — advisory says >=4.3.2, but 4.3.1 is still the latest published release as of 2026-10-29; via shadcn
    - GHSA-mrhx-c7xc-m3w5   # zod <4.6.6 (high). The fix is zod 4.6.6 only (v4 #6652). Forcing it onto @ag-ui/core@0.0.49 drops `type` from AGUIEvent and apollo-vertex does not build. Forcing it onto nextra@4.6.1 breaks the docs /_not-found prerender. Zod 3 (shadcn, MCP SDK) has no patched release. Consumers that already resolved 4.6.6 stay there.

# packageExtensions (moved from package.json#pnpm for the same reason)
packageExtensions:
  "@tanstack/ai":
    dependencies:
      "@standard-schema/spec": "^1.1.0"

# pnpm 11: build scripts are blocked by default — explicitly allow legitimate native builds.
# These packages require postinstall scripts to download platform-specific binaries or compile native code.
allowBuilds:
  '@biomejs/biome': true   # downloads platform-specific binary
  '@parcel/watcher': true  # native file-system watcher
  core-js: true            # polyfill compilation
  es5-ext: true            # ES5 extension build
  esbuild: true            # downloads native binary
  msw: true                # service worker init
  sharp: true              # native image processing
