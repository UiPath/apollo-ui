  "@hono/node-server": "2.1.3"          # GHSA-rmxm-3fg6-px4f (moderate, patched 2.1.3) plus earlier GHSA-frvp-7c67-39w9 / GHSA-9mqv-5hh9-4cgg (patched 2.0.10). Pinned exact: 2.1.4+ unvetted. 2.1.3 published 2026-09-29 (aged), OIDC approver yusukebe unchanged. @modelcontextprotocol/sdk still pins ^1.19.9; v2 API unchanged.
