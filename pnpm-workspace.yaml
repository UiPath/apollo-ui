packages:
  - 'packages/*'
  - 'web-packages/*'
  - 'apps/*'

# Peer dependency behaviour (moved from .npmrc — pnpm 11 limits .npmrc to auth/registry only)
autoInstallPeers: true
strictPeerDependencies: false

# Supply-chain hardening
# 14-day quarantine on newly-published packages (minutes; 14d × 1440)
minimumReleaseAge: 20160
# Exempt packages whose latest release is too new to satisfy the quarantine.
# The weekly `prune-release-age-exemptions` workflow auto-PRs removal of entries once aged.
#
# Format: - 'pkg@<vetted-version>'  # <version> — <reason>   (use `||` for multiple versions)
# Version-scope every entry: only the vetted version bypasses the quarantine; anything newer
# stays quarantined. Scope globs (platform binaries co-published per release) stay name-only.
# The version in the comment is required — the prune script uses it to decide when to remove the entry.
minimumReleaseAgeExclude:
  - '@uipath/*'                   # permanent — own scope, always installable immediately
  - '@turbo/*'                    # 2.9.14 — platform binaries co-published with turbo (scope rename from turbo-*), same OIDC provenance ✓
  - '@esbuild/*'                  # 0.28.1 — platform binaries co-published with esbuild in the same OIDC release, vetted 2026-06-16
  - '@next/*'                     # 16.4.1 — swc platform binaries + env co-published with next in the same OIDC release
  - '@img/*'                      # 0.35.5 — sharp platform binaries (@img/sharp-*) + sharp-libvips 1.3.4 co-published with sharp in the same OIDC release, provenance ✓, vetted 2026-10-09
  - 'happy-dom@21.0.4'            # 21.0.4 — GHSA-834v-8h66-3h79 (ESM compiler import-alias code injection; >=17.0.0 <=21.0.3, patched 21.0.4; 20.8.9 affected), vetted 2026-10-29: provenance ✓, publisher (OIDC trusted publisher, maintainer davidortner; fix PR #2537 by capricorn86) ✓, tag v21.0.4 ✓, integrity ✓
  - 'seroval@1.6.11'              # 1.6.11 — GHSA-97r2-qh9m-474h / GHSA-wp97-x4hv-qvhp / GHSA-7rv5-mrxv-xcr9 / GHSA-f86p-h4j2-7qgj / GHSA-9wx9-5pv9-3349, vetted 2026-10-29: no provenance (1.6.7 also had none), publisher lxsmnsyc unchanged ✓, no dep changes ✓, integrity ✓
  - 'body-parser@2.4.0'           # 2.4.0 — GHSA-27r3-jxmh-p828, vetted 2026-10-29: publisher personal→OIDC approver ulisesgascon ✓, new dep floor qs ^6.16.1 (pinned below) ✓
  - 'undici@6.29.1 || 7.30.1'     # 7.30.1 — GHSA-xjj6-f33q-929c / GHSA-4w7w-5xrc-9h26 / GHSA-2m5v-pch6-74hx / GHSA-qrxm-fqhp-jwvm / GHSA-4qv8-2p9j-2685 / GHSA-f72v-6w45-q472 / GHSA-9fm3-97px-rjf6 / GHSA-55wc-3pg8-jfw6, vetted 2026-10-29: OIDC publisher unchanged ✓
  - 'fast-uri@3.1.9'              # 3.1.9 — GHSA-w74x-v6f9-j3xg / GHSA-wjr9-j795-jxcr / GHSA-xhq7-xmqj-769h / GHSA-333x-w4r6-6crp, vetted 2026-10-29: publisher matteo.collina → OIDC (3.x never had provenance)
  - '@vitest/mocker@4.1.12'       # 4.1.12 — GHSA-qxg6-89mg-rqv8 / GHSA-xp26-3454-mjgp, vetted 2026-10-29: OIDC approver oreanno unchanged ✓
  - '@vitest/spy@4.1.12'          # 4.1.12 — exact dep of @vitest/mocker@4.1.12, vetted 2026-10-29: OIDC approver oreanno unchanged ✓
# Refuse transitive git/tarball deps (pnpm 11 default; kept explicit for clarity)
blockExoticSubdeps: true

