packages:
  - 'packages/*'
  - 'web-packages/*'
  - 'apps/*'

# Peer dependency behaviour (moved from .npmrc — pnpm 11 limits .npmrc to auth/registry only)
autoInstallPeers: true
strictPeerDependencies: false

# Supply-chain hardening
# 14-day quarantine on newly-published packages (minutes; 14d × 1440)
minimumReleaseAge: 20160
# Exempt packages whose latest release is too new to satisfy the quarantine.
# The weekly `prune-release-age-exemptions` workflow auto-PRs removal of entries once aged.
#
# Format: - 'pkg@<vetted-version>'  # <version> — <reason>   (use `||` for multiple versions)
# Version-scope every entry: only the vetted version bypasses the quarantine; anything newer
# stays quarantined. Scope globs (platform binaries co-published per release) stay name-only.
# The version in the comment is required — the prune script uses it to decide when to remove the entry.
minimumReleaseAgeExclude:
  - '@uipath/*'                   # permanent — own scope, always installable immediately
  - '@turbo/*'                    # 2.9.14 — platform binaries co-published with turbo (scope rename from turbo-*), same OIDC provenance ✓
  - '@esbuild/*'                  # 0.28.1 — platform binaries co-published with esbuild in the same OIDC release, vetted 2026-06-16
  - '@next/*'                     # 16.2.11 — swc platform binaries + env co-published with next in the same OIDC release
  - 'nanoid@3.3.18'               # 3.3.18 — GHSA-2v37-7h3g-55p8 / CVE-2026-67213 (high, infinite loop for zero-size custom generators); supersedes the 3.3.17 exemption, whose fix was incomplete (advisory range widened to <3.3.18 on 2026-08-13), vetted 2026-08-18: provenance ✓, publisher (OIDC, approver ai, unchanged from 3.3.17) ✓, tag+diff (async/index.native.js zero-size guard + default size, README docs line only) ✓, zero dependencies ✓, no install scripts ✓, integrity ✓
  - 'dompurify@3.4.13'            # 3.4.13 — GHSA-55q2-fjhq-7xh7 (moderate, IN_PLACE hook-removal XSS), vetted 2026-08-11: publisher (cure53, unchanged) ✓, signed tag+diff (security fixes + regression tests; CI-only action bumps excluded from tarball) ✓, zero runtime dependencies ✓, integrity ✓ (no provenance, historically none)
  - 'mermaid@11.16.1'             # 11.16.1 — GHSA-6x64-9x62-f2gx / GHSA-3rrr-jr9j-h3q3 / GHSA-2v8p-3f2j-5mp7 / GHSA-rhh3-jpg6-66xh (moderate) + GHSA-c4c3-pg64-4m4v (low, config prototype pollution), vetted 2026-08-06: provenance ✓, publisher (OIDC, release by aloisklink) ✓, tag+diff (PR #8022, styles/architecture/xychart/radar/config only) ✓, dependencies identical to 11.16.0 ✓, integrity ✓
  - 'fast-uri@3.1.6'              # 3.1.6 — GHSA-5jgf-p345-68v8 / GHSA-f65p-4m7j-42xc / GHSA-fph4-wmhf-6fwf / GHSA-jqff-g426-hqxp (high, host confusion + SSRF via IDN/percent handling; supersedes the 3.1.5 exemption), vetted 2026-09-04: publisher (matteo.collina, unchanged from 3.1.5) ✓, tag+diff (v3.1.6: index.js + lib/schemes + lib/utils + extensive security test suites) ✓, zero dependencies ✓, no install scripts ✓, integrity ✓ (no provenance, historically none for this package)
  - 'qs@6.16.0'                   # 6.16.0 — GHSA-4mjr-xmp4-gh2g / GHSA-x5fp-wj9c-mxmx (moderate, array-limit bypass via bracket-key comma parsing + attacker-controlled isBuffer DoS; 6.15.4 patches only the former), vetted 2026-09-04: publisher (ljharb, long-time maintainer, unchanged) ✓, tag+diff (v6.15.3...v6.16.0: lib/parse + lib/stringify + lib/utils + THREAT_MODEL + tests) ✓, deps (side-channel, es-define-property — unchanged family) ✓, no install scripts ✓, integrity ✓ (no provenance, historically none)
  - '@tiptap/core@3.30.4'         # 3.30.4 — GHSA-cp6q-959q-f8rh (moderate, mergeAttributes() __proto__ prototype pollution), vetted 2026-09-04: provenance ✓ (OIDC, GitHub Actions), tag+diff (v3.30.3...v3.30.4: core fix + changeset/workflow config) ✓, zero dependencies ✓, no install scripts ✓, integrity ✓ — extensions stay at apollo-react's ^3.19 range (peer on core >=3.30.4, pm ^3.19)
  - '@tiptap/pm@3.30.4'           # 3.30.4 — no advisory; pulled to satisfy @tiptap/core@3.30.4's exact-version peer on @tiptap/pm (core ships in lockstep; 3.19.0 left the peer unmet), vetted 2026-09-04: provenance ✓ (npm attestation), prosemirror re-export bundle (deps are the 13 prosemirror-* packages only) ✓, no install scripts ✓, integrity ✓ — satisfies the extensions' ^3.19 peer range too
  - '@xmldom/xmldom@0.9.12'       # 0.9.12 — GHSA-6gmq-8vp8-gcm6 (moderate), vetted 2026-09-04: publisher (karfau, long-time xmldom maintainer, unchanged) ✓, tag+diff (0.9.10...0.9.12: lib/{dom,dom-parser,errors,grammar,sax} + CI workflows) ✓, no install scripts ✓, integrity ✓ (no provenance, historically none) — ages out of quarantine 2026-09-04T22:32Z
  - 'hono@4.12.34'                # 4.12.34 — GHSA-8j4g-w8fx-2239 (moderate, ReDoS in CORS middleware via Access-Control-Request-Headers), vetted 2026-08-06: provenance ✓, publisher (OIDC, approver yusukebe) ✓, tag+diff (v4.12.34, src/middleware/cors/index.ts +1/-1 + test, via private security-fork merge) ✓, zero dependencies ✓, integrity ✓
  - 'framer-motion@13.1.0'        # 13.1.0 — Motion v13 upgrade (drops v12's @emotion/is-prop-valid dynamic require behind Rspack's critical-dependency warning), vetted 2026-08-12: publisher (popmotion, unchanged since v12) ✓, upstream tag v13.1.0 ✓, deps unchanged (tslib, motion-dom, motion-utils) ✓, no install scripts ✓, integrity ✓ (no provenance, historically none)
  - 'motion@13.1.0'               # 13.1.0 — wrapper package of framer-motion@13.1.0, vetted 2026-08-12: publisher (popmotion, unchanged since v12) ✓, upstream tag v13.1.0 ✓, deps (tslib, framer-motion) ✓, no install scripts ✓, integrity ✓ (no provenance, historically none)
  - 'motion-dom@13.0.0'           # 13.0.0 — framer-motion@13.1.0 runtime dep, vetted 2026-08-12: publisher (popmotion, unchanged since v12) ✓, upstream tag v13.0.0 ✓, deps (motion-utils) ✓, no install scripts ✓, integrity ✓ (no provenance, historically none)
  - 'motion-utils@13.0.0'         # 13.0.0 — framer-motion@13.1.0 runtime dep, vetted 2026-08-12: publisher (popmotion, unchanged since v12) ✓, upstream tag v13.0.0 ✓, zero dependencies ✓, no install scripts ✓, integrity ✓ (no provenance, historically none)
# Refuse transitive git/tarball deps (pnpm 11 default; kept explicit for clarity)
blockExoticSubdeps: true

# Dependency version overrides (moved from package.json#pnpm — pnpm 11 ignores that field, pnpm/pnpm#11536)
overrides:
  minimatch: "^10.2.5"
  lodash: "^4.18.1"
  tmp: "^0.2.6"
  picomatch: ">=4.0.4"
  postcss: "^8.5.23"                    # GHSA-r28c-9q8g-f849 (high, sourceMappingURL path traversal; patched 8.5.18) + GHSA-fxqj-rqcc-2cmp (moderate, incomplete fix of the above; patched 8.5.23) — vetted 2026-08-06: provenance ✓, publisher (OIDC, approver ai) ✓, tag+diff ✓, integrity ✓ (resolves 8.5.23; 8.5.24-8.5.26 still quarantined and carry unrelated list.split/BOM changes)
  hono: "^4.12.34"                      # GHSA-88fw-hqm2-52qc (high)/rv63/wwfh/j6c9/wgpf + GHSA-xgm2-5f3f-mvvc/hvrm-45r6-mjfj/w62v-xxxg-mg59 (moderate, fixed 4.12.27) + GHSA-8j4g-w8fx-2239 (moderate, ReDoS in CORS middleware; patched 4.12.34) — vetted 2026-08-06; transitive via @modelcontextprotocol/sdk (resolves 4.12.34; 4.13.0 still quarantined)
  "@hono/node-server": "^2.0.10"        # GHSA-frvp-7c67-39w9 (moderate, Windows serve-static path traversal; no 1.x patch) + GHSA-9mqv-5hh9-4cgg (moderate, WebSocket handshake memory-leak DoS; patched 2.0.10) — @modelcontextprotocol/sdk still pins ^1.19.9; v2 public API unchanged (Node 20+ only), vetted 2026-07-24
  dompurify: ">=3.4.13"                 # GHSA-vxr8-fq34-vvx9/gvmj/x4vx/rp9w/r47g/hpcv/76mc + GHSA-cmwh-pvxp-8882 + GHSA-c2j3-45gr-mqc4 + GHSA-55q2-fjhq-7xh7 (moderate, IN_PLACE hook-removal XSS; patched 3.4.13), vetted 2026-08-11; monaco-editor pins exact 3.2.7
  # Audit batch vetted 2026-09-04 (pnpm audit failures on PR #1121's fresh CI run — new advisories, all transitives)
  browserslist: ">=4.28.7"              # GHSA-c83g-rgw3-j3cx + GHSA-73wf-gq98-2v4g (high, unbounded memory growth / prototype write) — babel/storybook toolchain transitive; 4.28.7 published 2026-07-21 (aged past quarantine)
  fast-uri: "^3.1.6"                    # GHSA-5jgf-p345-68v8/f65p/fph4/jqff (high, host confusion + SSRF) — ajv transitive, kept on the 3.x line ajv expects (4.x has its own unpatched-in-range advisories); quarantine exemption above
  sanitize-html: ">=2.17.7"             # GHSA-g8qq-57p8-ggw5 (moderate, stored XSS via SVG SMIL URI-list) — 2.17.7 published 2026-08-13 (aged)
  qs: ">=6.16.0"                        # GHSA-4mjr-xmp4-gh2g + GHSA-x5fp-wj9c-mxmx (moderate) — quarantine exemption above
  "@tiptap/core": ">=3.30.4"            # GHSA-cp6q-959q-f8rh (moderate, mergeAttributes __proto__ pollution) — ap-chat dep, within apollo-react's ^3.19 range; quarantine exemption above
  "@tiptap/pm": ">=3.30.4"              # no advisory — @tiptap/core@3.30.4 peers on @tiptap/pm 3.30.4 exactly (lockstep releases); quarantine exemption above
  "@xmldom/xmldom": ">=0.9.12"          # GHSA-6gmq-8vp8-gcm6 (moderate) — quarantine exemption above
  fflate: ">=0.8.3"                     # GHSA-px8p-9vwx-vf98 (moderate) — 0.8.3 published 2026-05-16 (aged)
  postcss-selector-parser: ">=7.1.3"    # GHSA-w9m9-85wc-3x92 (low) — 7.1.3 published 2026-06-11 (aged)
  sharp: "^0.35.0"                      # GHSA-f88m-g3jw-g9cj (high, libvips CVE-2026-33327/33328/35590/35591) — next@16.2.11 pins ^0.34.5 (0.x caret excludes 0.35); next canary already on ^0.35.3, vetted 2026-07-24
  js-yaml: ">=5.2.2"                   # GHSA-h67p-54hq-rp68 (moderate) + GHSA-pm4m-ph32-ghv5 (high, flow-collection parsing DoS; patched 5.2.2) — transitive via @commitlint/load>cosmiconfig; vetted 2026-07-28
  markdown-it: ">=14.1.2"              # GHSA-6v5v-wf23-fmfq (moderate) — transitive via storybook toolchain
  "@babel/core": ">=7.29.1"            # GHSA-4x5r-pxfx-6jf8 (low) — transitive via storybook/babel transform
  rolldown: "1.0.1"                    # vite 8 dep-optimizer regression: rolldown 1.0.2/1.0.3 emit chunks that call cross-chunk init_*() without importing it -> "init_*_esm is not defined" at runtime (Storybook preview crash). Upstream still open (rolldown#9515 / vite#22583, both p1). 1.0.1 is the last good rolldown; keep vite 8.0.16 (security-patched) and pin rolldown back. Remove once fixed upstream.
  # Security pins (vetted 2026-06-16)
  esbuild: "^0.28.1"                    # GHSA-gv7w-rqvm-qjhr (high)/GHSA-g7r4-m6w7-qqqr (low) — Storybook 10.4.x widened its range (@storybook/csf-plugin@10.4.1 now allows esbuild ^0.28.1) and nothing in the tree still pins <0.28; override retained as defense-in-depth to pin the patched line
  "ws@>=8.0.0 <9": "^8.21.0"            # GHSA-96hv-2xvq-fx4p (high) — latest engine.io-client (6.6.5) still pins ws ~8.20.1; blocked upstream at Socket.IO
  "@opentelemetry/core": "^2.8.0"       # GHSA-8988-4f7v-96qf (moderate) — @uipath/core-telemetry pins sdk-logs ^0.204.0 which pins core/resources exactly 2.1.0; bump upstream to drop
  "@opentelemetry/resources": "^2.8.0"  # lockstep with core 2.8.0 (sdk-logs/resources pin core exactly at 2.1.0)
  valibot: "^1.4.2"                     # GHSA-5qjj-4xww-7phc (moderate, flatten() throws on inherited Object property names; patched 1.4.2) — @storybook/mcp & @storybook/addon-mcp pin exact 1.2.0 (even latest 0.7.0/0.8.0 still do), no parent fix as of 2026-07-28; vetted 2026-07-28: provenance ✓, publisher (OIDC) ✓, tag+diff (#1522 by fabian-hiller) ✓, integrity ✓
# packageExtensions (moved from package.json#pnpm for the same reason)
packageExtensions:
  "@tanstack/ai":
    dependencies:
      "@standard-schema/spec": "^1.1.0"

# pnpm 11: build scripts are blocked by default — explicitly allow legitimate native builds.
# These packages require postinstall scripts to download platform-specific binaries or compile native code.
allowBuilds:
  '@biomejs/biome': true   # downloads platform-specific binary
  '@parcel/watcher': true  # native file-system watcher
  core-js: true            # polyfill compilation
  es5-ext: true            # ES5 extension build
  esbuild: true            # downloads native binary
  msw: true                # service worker init
  sharp: true              # native image processing
